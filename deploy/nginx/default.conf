resolver 127.0.0.11 valid=30s ipv6=off;

# Não expor a versão do nginx nas respostas/erros (F-02).
server_tokens off;

server {
  listen 80;
  server_name app.filtrovali.com.br;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 80;
  server_name relatorios.filtrovali.com.br;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location = / {
    return 301 https://app.filtrovali.com.br/rdo;
  }

  location / {
    return 301 https://app.filtrovali.com.br$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name relatorios.filtrovali.com.br;

  ssl_certificate /etc/letsencrypt/live/relatorios.filtrovali.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/relatorios.filtrovali.com.br/privkey.pem;

  location = / {
    return 301 https://app.filtrovali.com.br/rdo;
  }

  location / {
    return 301 https://app.filtrovali.com.br$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name app.filtrovali.com.br;

  root /usr/share/nginx/html;

  ssl_certificate /etc/letsencrypt/live/relatorios.filtrovali.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/relatorios.filtrovali.com.br/privkey.pem;

  client_max_body_size 30M;

  # Cabeçalhos de segurança (F-01). `always` garante que se apliquem também às
  # respostas do backend via proxy e a respostas de erro.
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options    "nosniff" always;
  add_header X-Frame-Options           "DENY" always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
  # CSP: validar em staging. A app usa blob:/data: para imagens e assinaturas; o
  # Vite pode injetar estilos inline. Evoluir para nonce/hash e remover 'unsafe-inline'.
  add_header Content-Security-Policy    "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  location /api/ {
    set $backend http://backend:4000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 15s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
  }

  location = /api {
    set $backend http://backend:4000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 15s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
  }

  location /assets/ {
    try_files $uri @backend;
  }

  location /uploads/ {
    set $backend http://backend:4000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 15s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
  }

  location /relatorios/ {
    set $backend http://backend:4000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 15s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
  }

  location /certificados-calibracao/ {
    set $backend http://backend:4000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 15s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
  }

  location = /health {
    set $backend http://backend:4000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 15s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location @backend {
    set $backend http://backend:4000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 15s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
  }
}
